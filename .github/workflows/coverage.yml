name: Coverage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: GCC coverage baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install gcovr
        run: python -m pip install gcovr==8.6

      - name: Configure coverage build
        env:
          CC: gcc
          CXX: g++
        run: >
          cmake
          -S .
          -B build-coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DZERO_CPU_ENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build-coverage --parallel 2

      - name: Run CTest
        run: >
          ctest
          --test-dir build-coverage
          --output-on-failure
          --timeout 120

      - name: Generate coverage reports
        shell: bash
        run: |
          mkdir -p coverage

          gcovr             --root .             --object-directory build-coverage             --filter 'src/'             --filter 'include/'             --txt coverage/coverage.txt             --html-details coverage/coverage.html             --cobertura-pretty             --cobertura coverage/coverage.xml             --print-summary

          {
            echo "## Zero-CPU coverage baseline"
            echo
            echo '```text'
            cat coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: zero-cpu-coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
          retention-days: 14
